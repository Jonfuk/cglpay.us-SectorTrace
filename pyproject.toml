[project]
name = "sub-misuse-evidence-pipeline"
version = "0.1.0"
description = "England-wide substance misuse sector evidence pipeline for a trade union pay campaign evidence base"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tables = [
    "camelot-py[cv]>=0.11",
]
sheets = [
    "gspread>=6.0",
    "google-auth>=2.28",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live external sources, skipped by default",
]
addopts = "-m 'not integration'"
