[project]
name = "sub-misuse-evidence-pipeline"
version = "0.1.0"
description = "England-wide substance misuse sector evidence pipeline for a trade union pay campaign evidence base"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    # Trogon derives a terminal UI from the Typer command schema; the TUI
    # invokes these same commands, so it belongs with the application CLI.
    "trogon>=0.6",
    # Progress display and the run summary. Previously present only as a
    # transitive dependency of typer; pipeline/console.py imports it
    # directly, so it is declared rather than relied on by accident.
    "rich>=13.0",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "shapely>=2.1.2",
    "odfpy>=1.4.1",
    # Analysis is deliberately local and bounded; it never becomes a second
    # evidence store.  Neo4j itself remains optional in the graph extra below.
    "networkx>=3.2",
    # The SectorTrace ontology (pipeline/nlp/ontology/, BETA-034B) is a
    # hand-maintained controlled vocabulary: YAML because it carries comments
    # and reads without quoting/commas, and it must load with no extra
    # installed (034C's classifier depends on it and is always-on). Already
    # present transitively; declared here rather than relied on by accident,
    # the same call made for `rich` above.
    "pyyaml>=6.0",
    # PostgreSQL 18 is the only application database (performance.md Phase 1,
    # Architecture Decision Review). psycopg and psycopg_pool are therefore
    # core dependencies, not the optional `postgres` extra they used to be:
    # there is no longer a driver-less SQLite path for a checkout, CI, or a
    # test to fall back to. `psycopg[binary]` avoids a libpq build step on
    # Windows, where development happens; a deployment that would rather link
    # the system libpq installs plain `psycopg` itself, and nothing here
    # depends on which. The Python adapter remains available with the core
    # PostgreSQL set even while embeddings.py uses pgvector's text form; Phase
    # 3 may use it for typed vector parameters.
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "pgvector>=0.3",
]

[project.scripts]
# Installs a `pipeline` console command equivalent to `python -m pipeline`.
# Both entry points resolve to the same Typer app, so `uv run pipeline …` and
# `uv run python -m pipeline …` behave identically.
pipeline = "pipeline.cli:app"

[project.optional-dependencies]
# There was a `tables` extra here pinning camelot-py[cv], added at scaffold
# time in case PDF table extraction needed more than pdfplumber. Nothing ever
# imported it. Removed rather than left in place: an extra nobody installs is
# a claim about how this pipeline reads PDFs that is not true of any line of
# it, and camelot brings Ghostscript and OpenCV with it.
#
# Every PDF parser here reads text (pdfplumber's extract_text) and locates
# values by position and pattern, tested against documents captured from the
# real sources -- the DHSC grant tables, the charity accounts staff-costs
# note, the MHCLG budget returns. Switching to lattice/stream table detection
# would be a rewrite of those parsers, not a drop-in, and it would have to
# earn its way in against fixtures that currently pass.
sheets = [
    "gspread>=6.0",
    "google-auth>=2.28",
]

# Reading PFD reports that were scanned rather than typed. An extra, not a
# dependency, because it is large and only one module needs it: seven of every
# twelve reports in m08's backlog are paper scans with no text layer, and the
# other five -- and every other PDF this pipeline reads -- need nothing here.
#
# Without it installed, m08 does exactly what it did before: records a review
# item saying the report is a scan. `pipeline.ocr.available()` is the only
# thing that changes, and it is checked rather than assumed.
#
# Not pytesseract: Tesseract is a system binary someone has to install by hand
# on every machine that runs this, and an evidence pipeline that silently skips
# a thousand documents because a package manager was not run is worse than one
# that says it cannot read them.
#
# Not rapidocr-onnxruntime either, though it was tried first and it bundles its
# models rather than downloading them, which would have been the better
# property. Its recogniser is trained on Chinese and it welds English words
# together on tightly-set lines: a real report came back as
# "foraperiodofaboutsixmonthsatdoublethestipulatedmaximumdose". That is not
# cosmetic. The concern-term index is how a reader finds the reports worth
# reading, and a term buried inside a run-together word is not found. OnnxTR's
# English recogniser reads the same line as "for a period of about six months
# at double the stipulated maximum dose", and does it in two thirds of the
# time.
#
# The cost of the choice: OnnxTR downloads its models on first use (about
# 105 MB, cached under ~/.cache/onnxtr) rather than shipping them in the wheel,
# so the first OCR run needs the network.
#
#   uv sync --extra ocr
#
# onnxruntime is pinned below 1.20 because this project targets Python 3.10
# and 1.20 onwards ships no cp310 wheel. Raise it when requires-python does.
# `cpu-headless` is OnnxTR's own extra: CPU inference and the headless build
# of OpenCV. The plain `cpu` extra pulls the desktop OpenCV, whose GUI
# libraries are of no use to a pipeline and do not exist on a server.
ocr = [
    "onnxtr[cpu-headless]>=0.8",
    "onnxruntime>=1.16,<1.20",
    "pypdfium2>=4.0",
]

storage = [
    "boto3>=1.34",
]

# Heavy, local-only document-analysis tooling.  Railway deliberately does not
# install this extra: publication reads the already-persisted canonical model
# and must not download parser models or require OCR system binaries at start.
documents = [
    "PyMuPDF>=1.24,<2",
    "docling>=2.70,<3",
    "ocrmypdf>=16,<17",
]

# The graph driver is opt-in for the same reason PostgreSQL is: a normal
# SQLite-only collection run must remain runnable without a graph service.
graph = [
    "neo4j>=5.20",
]

# The semantic-analysis layer's model, local-only, first-use download,
# excluded from the Railway image -- the same pattern as `documents` and
# `ocr`. Nothing in `pipeline/nlp/` imports it at module load: chunking needs
# nothing, and `--model stub` gives CI and offline development a deterministic
# embedder with no weights on disk. `uv sync --extra nlp` is the opt-in that
# turns on real embeddings and `--mode semantic` / `hybrid` search.
#
# 034A added sentence-transformers (it pulls torch + transformers +
# huggingface_hub). 034D adds gliner for zero-shot entity spans -- it reuses
# the same torch/transformers stack, so the extra does not grow a second
# heavy tree. spaCy / medSpaCy join when the assertion tranche (034E) lands
# -- see docs/semantic-analysis.md.
#
# 034G adds setfit for the claim-prediction bake-off. It pulls `datasets` and
# `scikit-learn` (its classifier head); scikit-learn is pinned explicitly
# because the SetFit arm is not the only user -- it is also a dependency
# nothing else declares. The project's OWN logreg head (claims_train.py) is
# pure Python + numpy and needs neither, so the default test suite covers the
# bake-off's logreg path without this extra; the SetFit path sits behind the
# `slow` pytest marker. See docs/claim-predictions-spec.md.
#
# transformers is held below 5 and sentence-transformers below 6 for setfit's
# sake: setfit 1.1.3 (its latest) still does
# `from transformers.training_args import default_logdir`, a symbol
# transformers 5 removed, so it fails to import against the 5.x line that
# sentence-transformers 6 requires. This does NOT touch the always-on
# app/Railway image: that one installs `postgres storage graph` only and
# pulls no transformers at all. The `nlp` extra is the local
# document-analysis worker's (deploy/Dockerfile.documents), which is the only
# deployed image where transformers is installed -- so the pin is effectively
# scoped to that worker. Lift it when setfit supports transformers 5.
nlp = [
    "sentence-transformers>=3.0,<6",
    "transformers>=4.51.3,<5",
    "gliner>=0.2.13",
    "setfit>=1.1",
    "scikit-learn>=1.4",
]

# The documentation site. An extra rather than a dependency-group because a
# collection run and the test suite must both stay runnable without it: the
# site is built by CI and by whoever is editing docs, and by nobody else.
#
# The point of it is not publishing, it is drift. `mkdocs build --strict`
# fails on a link to a file that no longer exists, on a doc that was added
# without a nav entry, and on a reference to a module that was renamed --
# the same class of gap tests/test_docs_coverage.py already guards for the
# README, applied to the rest of docs/.
#
# mkdocstrings reads the source with griffe, which parses rather than
# imports. That matters here: importing every module to document it would
# run module-level code in a build that has no database and no network.
docs = [
    "mkdocs>=1.6",
    # A hard fork of mkdocs-material (squidfunk's history is in it; MIT),
    # carrying the theme name `materialx` and Pagefind in place of lunr.
    # It cannot be installed beside mkdocs-material -- both own the
    # `material` package -- so this replaces it rather than adding to it.
    "mkdocs-materialx>=10.2",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    # Last-updated dates resolved from git at build time. Not MaterialX's
    # bundled document-dates, which ships a core.js that probes
    # gravatar.com and weavatar.com on every page load even with authors
    # turned off -- a third-party request and a visitor-IP leak, and this
    # site is not allowed either.
    "mkdocs-git-revision-date-localized-plugin>=1.2",
]

# BETA-107: a natural-language operator layer. It is an extra, not a
# dependency, and everything about it is off by default:
# `Settings.assistant_enabled` is False, `pipeline/assistant/` is importable
# with none of this installed, and the Railway image does not install
# `[assistant]` (Procfile / railway.toml pin the base install). The offline
# test suite never makes a call.
#
# Two adapters, both OpenAI-chat-compatible over HTTP so neither needs a
# native runtime in-process: a router leg and an answerer leg, configured
# independently. BETA-107 reached a local Needle 2 / Ollama pair; BETA-114
# retargeted both at OpenRouter (a CPU-only VPS could not route in time — see
# `docs/assistant.md`). `openai` is the only pin — the client library for
# both `/v1` endpoints; the model slugs and the key are configuration.
assistant = [
    "openai>=1.40,<2",
]

# Dev tooling lives in a dependency-group, not an optional-dependency extra,
# so a plain `uv sync` (which start.sh runs) installs it by default. As an
# extra it was omitted from the default sync, and running the startup script
# would silently uninstall pytest from a working checkout.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.ruff]
# The measured house width: p99 of every line in pipeline/ and tests/ is 99
# characters. Recorded so a formatter or a future rule has the right number,
# not as a gate — see the E501 note below.
line-length = 100

[tool.ruff.lint]
# Ruff's own default (E4/E7/E9 + F), plus import sorting. Deliberately narrow.
#
# This is here for consistency between sessions working on the same checkout,
# not to find defects: 1,357 tests do that. So the rules enabled are the ones
# where there is one right answer and no judgement to exercise — an unused
# import, a shadowed name, imports in a stable order so two sessions editing
# the same header do not conflict over it.
#
# Four families were considered and left off, each for a reason:
#
#   E501 (line too long) — 269 lines exceed 100, and most are explanatory
#     comments. In this codebase the comments are the documentation; reflowing
#     prose to satisfy a linter is the tail wagging the dog, and a `noqa` on
#     every long URL is noise.
#   BLE001 (blind except) — 27 hits, nearly all deliberate and commented: a
#     log handler that must never raise, a job store that must not be able to
#     refuse a run. A rule that fights a documented decision is a rule that
#     gets ignored.
#   ISC (implicit string concatenation) — the long SQL in this project is
#     written as adjacent literals on purpose, and reads better for it.
#   D (docstrings) — the convention here is that a docstring explains a
#     constraint or a reason. A rule enforcing that every function has one
#     produces functions with a sentence restating their name.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live external sources, skipped by default",
    "slow: needs a heavy optional model (e.g. a real SetFit fine-tune); skipped by default",
]
addopts = "-m 'not integration and not slow'"
