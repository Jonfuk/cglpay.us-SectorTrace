name: tests

# The offline suite, on every push and pull request. Nothing here reaches a
# real source: the `integration` marker is deselected by default in
# pyproject.toml, and it stays that way — this pipeline's politeness
# commitment does not have an exception for CI, and a workflow that crawls
# public bodies on every push would be exactly that.
on:
  push:
  pull_request:

# A second push while the first is still running supersedes it. Several
# sessions commit to this repo in a day.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. This workflow reads the code, runs the
# suite and writes nothing back, so `contents: read` is the whole of what it
# needs — and a token scoped to what a job does is a token a compromised
# dependency cannot use to push. CodeQL reported the omission as
# `actions/missing-workflow-permissions`; codeql.yml already declared its own.
permissions:
  contents: read

jobs:
  test:
    # Ubuntu, while development is on Windows. That is deliberate: every path
    # in this project is already `Path`-based and the suite has never been run
    # anywhere else, so the first thing this will tell us is whether that is
    # true. If it turns out not to be, that is the finding.
    runs-on: ubuntu-latest
    # The PostgreSQL-only suite is intentionally comprehensive and its
    # documented clean run is about 35 minutes on GitHub's Ubuntu runner.
    timeout-minutes: 45

    steps:
      # Pinned to a commit rather than a tag: a tag is a moving pointer
      # the action's owner can repoint, so `@v7` is a promise to run
      # whatever that repository decides `v7` means on the day. The
      # comment keeps the version readable; Dependabot updates both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra maps

      - name: Start PostgreSQL 18 test database
        # The application test suite is PostgreSQL-only. Build the same image
        # used for local development so CI has pgvector, pg_trgm, and PostGIS
        # rather than silently exercising a different database capability set.
        run: |
          docker build --tag sectortrace-postgres:18-test deploy/postgres
          docker run --detach --name sectortrace-postgres --publish 5432:5432 \
            --env POSTGRES_USER=sectortrace_app \
            --env POSTGRES_PASSWORD=sectortrace_app_dev \
            --env POSTGRES_DB=postgres \
            --volume "$PWD/deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            sectortrace-postgres:18-test
          until docker exec sectortrace-postgres pg_isready -U sectortrace_app -d postgres; do
            sleep 1
          done

      - name: Lint
        run: uv run ruff check pipeline tests

      - name: Check Python fallback and optional Mojo boundary
        run: |
          NLP_ACCELERATOR=auto uv run python -c "from pipeline.nlp.accelerator import select; select('auto')"
          uv run python scripts/build_mojo_nlp.py --if-available

      - name: Validate the beta work queue
        # BETA-038: structural check on beta.md's machine-readable queue —
        # unknown states, heading/prefix mismatches, duplicate IDs, more than
        # one IN_PROGRESS, a current item with no next_action. Exits 0 with a
        # notice on branches that do not carry the file (it lives only on
        # `beta`), so this is safe to run on every push.
        run: uv run python scripts/validate_beta_queue.py

      - name: Check machine-owned documentation blocks
        # BETA-067: the generated blocks in docs/ (currently the source
        # capability matrix in docs/SOURCES.md) must match what the in-code
        # registries produce. A registry change without `pipeline docs-sync`
        # fails here with a diff. `test_docs_matrix.py` covers the same thing
        # from the suite; this is the fast standalone signal.
        run: uv run python -m pipeline docs-check

      - name: Parallel PostgreSQL tests
        # Each xdist worker gets its own migrated schema in tests/conftest.py.
        # loadscope keeps module-scoped fixtures together while allowing the
        # independent modules to use all runner CPUs. The serial marker is
        # reserved for tests that intentionally exercise process-global state.
        env:
          POSTGRES_TEST_URL: postgresql://sectortrace_app:sectortrace_app_dev@localhost:5432/sectortrace
          DATABASE_URL: postgresql://sectortrace_app:sectortrace_app_dev@localhost:5432/sectortrace
          CONTACT_EMAIL: test@example.com
        run: |
          mkdir -p artifacts
          set -o pipefail
          uv run python -m pytest -q --tb=short -m "not serial and not integration" -n auto \
            --dist loadscope --durations=50 --junitxml=artifacts/pytest-parallel.xml \
            > artifacts/pytest-parallel.log 2>&1
          status=$?
          cat artifacts/pytest-parallel.log
          grep -E '^(FAILED|ERROR)' artifacts/pytest-parallel.log | while read -r line; do
            echo "::error::$line"
          done || true
          exit $status

      - name: Serial PostgreSQL tests
        if: always()
        # Process-global counters, clocks, console handlers, and logging
        # configuration are deliberately tested in one process. They are not
        # part of the parallel lane, even though database schemas are isolated.
        env:
          POSTGRES_TEST_URL: postgresql://sectortrace_app:sectortrace_app_dev@localhost:5432/sectortrace
          DATABASE_URL: postgresql://sectortrace_app:sectortrace_app_dev@localhost:5432/sectortrace
          CONTACT_EMAIL: test@example.com
        run: |
          mkdir -p artifacts
          set -o pipefail
          uv run python -m pytest -q --tb=short -m "serial and not integration" --durations=50 \
            --junitxml=artifacts/pytest-serial.xml \
            > artifacts/pytest-serial.log 2>&1
          status=$?
          cat artifacts/pytest-serial.log
          grep -E '^(FAILED|ERROR)' artifacts/pytest-serial.log | while read -r line; do
            echo "::error::$line"
          done || true
          exit $status

      - name: Upload pytest timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-timings-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  nlp-compat:
    # The NLP extra is optional at runtime and intentionally has its own job:
    # it is a heavyweight document-analysis dependency tree, but its import
    # boundary must still be exercised whenever the patched security line moves.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          enable-cache: true

      - name: Check optional NLP dependency compatibility
        # tests/conftest.py deliberately makes PostgreSQL an autouse fixture for
        # the behavioural suite. This boundary check is import-only, so keep it
        # independent of a warehouse and avoid turning an optional dependency
        # check into a database job.
        run: >-
          uv run --extra nlp python -c
          "import transformers; from packaging.version import Version; from
          setfit.compat import default_logdir; v=Version(transformers.__version__);
          assert Version('5.10.4') <= v < Version('6'); assert callable(default_logdir)"
