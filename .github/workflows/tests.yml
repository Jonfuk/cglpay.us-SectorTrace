name: tests

# The offline suite, on every push and pull request. Nothing here reaches a
# real source: the `integration` marker is deselected by default in
# pyproject.toml, and it stays that way — this pipeline's politeness
# commitment does not have an exception for CI, and a workflow that crawls
# public bodies on every push would be exactly that.
on:
  push:
  pull_request:

# A second push while the first is still running supersedes it. Several
# sessions commit to this repo in a day.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. This workflow reads the code, runs the
# suite and writes nothing back, so `contents: read` is the whole of what it
# needs — and a token scoped to what a job does is a token a compromised
# dependency cannot use to push. CodeQL reported the omission as
# `actions/missing-workflow-permissions`; codeql.yml already declared its own.
permissions:
  contents: read

jobs:
  test:
    # Ubuntu, while development is on Windows. That is deliberate: every path
    # in this project is already `Path`-based and the suite has never been run
    # anywhere else, so the first thing this will tell us is whether that is
    # true. If it turns out not to be, that is the finding.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to a commit rather than a tag: a tag is a moving pointer
      # the action's owner can repoint, so `@v7` is a promise to run
      # whatever that repository decides `v7` means on the day. The
      # comment keeps the version readable; Dependabot updates both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check pipeline tests

      - name: Tests
        # Run WITHOUT the postgres extra, which is the configuration pyproject
        # claims must keep working: "a fresh checkout, CI, and every test that
        # does not name a backend open a file, and none of them should need a
        # database driver on the machine". That claim is now tested rather than
        # asserted — it was false, and had been since the PostgreSQL backend
        # landed. One test module imported `pipeline.pg` at the top, psycopg is
        # not installed here, and collection aborted before a single test ran.
        # The whole offline suite went with it.
        #
        # Failures are echoed back as `::error::` workflow commands, which
        # become annotations on the run. Annotations are readable without a
        # token; the raw logs are not, so a red build was otherwise a red
        # light with no message attached to anyone without repo access.
        run: |
          set -o pipefail
          uv run python -m pytest -q --tb=short > pytest.log 2>&1 && exit 0
          status=$?
          echo "::group::pytest output"
          cat pytest.log
          echo "::endgroup::"
          grep -E '^(FAILED|ERROR)' pytest.log | while read -r line; do
            echo "::error::$line"
          done
          tail -1 pytest.log | sed 's/^/::error::summary: /'
          exit $status

      - name: Sync dependencies, with the PostgreSQL driver
        run: uv sync --extra postgres

      - name: Tests that need the driver
        # The modules that behave differently when psycopg is importable, and
        # only those: the full suite has already run above, and running all of
        # it twice would buy nothing but minutes. The live suites are in the
        # list and skip themselves — POSTGRES_TEST_URL is not set here, and
        # nothing in CI reaches a database any more than it reaches a source.
        run: |
          uv run python -m pytest -q --tb=short \
            tests/test_pg_row.py \
            tests/test_backend_selection.py \
            tests/test_sqldialect.py \
            tests/test_postgres_live.py \
            tests/test_pg_migration_live.py

  docs:
    # A separate job from `test`, not another step in it. The docs build needs
    # a dependency set the suite deliberately does not install, and the two
    # answer different questions: `test` asks whether the code works, this
    # asks whether the documentation still describes code that exists.
    #
    # --strict is the entire point. It fails on a link to a file that has been
    # renamed or deleted, on a document added to docs/ without a nav entry,
    # and on an in-page anchor that no heading produces. Every one of those is
    # a way documentation goes quietly wrong between the change and the day
    # somebody tries to follow it.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          enable-cache: true

      - name: Sync dependencies, with the docs extra
        run: uv sync --extra docs

      - name: Lint
        run: uv run ruff check scripts

      - name: Build the documentation
        # mkdocstrings reads pipeline/ with griffe, which parses rather than
        # imports, so this needs no database, no network and no source extras.
        # If that ever stops being true this job will be the thing that says
        # so, loudly, rather than a doc build that quietly starts a run.
        run: uv run mkdocs build --strict
