name: codeql

# Static analysis, for the class of defect the offline suite cannot reach.
#
# The argument for it here is specific rather than general: S-01 was a real
# server-side request forgery that shipped — `check-url` would fetch any host
# whose netloc contained a dot, including `192.168.1.1` — and it was found by
# an audit rather than by a test. `pipeline/netguard.py` is the fix, and it is
# the shape of thing CodeQL's `python-security-extended` suite exists to catch
# before an audit does.
#
# Expect findings that are correct by design on the first run. This project
# composes SQL by string interpolation in `pipeline/web/public_queries.py` and
# elsewhere, with the values bound as parameters and the composed fragments
# coming from module-level constants rather than from requests. Where a result
# is wrong, dismiss it in the Security tab **with a reason** — a dismissal
# without one is indistinguishable next quarter from a defect nobody looked at.
#
# Nothing here reaches a real source. CodeQL reads the checkout; it does not
# run the pipeline.
#
# ---------------------------------------------------------------------------
# This workflow is the *only* CodeQL configuration on the repository, and it
# has to stay that way.
#
# GitHub offers a second one — "default setup", enabled from Settings — and
# the two cannot coexist: an advanced configuration's results are refused with
# "CodeQL analyses from advanced configurations cannot be processed when the
# default setup is enabled", and the job fails at the upload step after
# running the whole analysis. That was live on this repository from
# 2026-08-13 until 2026-08-14, so every push and every pull request carried a
# red `analyze` check that had nothing to do with the code in it. A check that
# is always red is a check nobody reads.
#
# Default setup was turned off rather than this file deleted, because the two
# are not equivalent. Default setup runs the **default** query suite, which is
# the quiet one; this runs `security-extended`, which is where the
# request-forgery and path-traversal queries live — the queries S-01 was.
# Losing those to keep a green tick would be the trade this project exists to
# refuse.
#
# What default setup did cover and this file now has to: it scanned
# `javascript-typescript` and `actions` as well as `python`. Those are in the
# matrix below for that reason. If you ever re-enable default setup, delete
# this file in the same change.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, because a query suite that only runs on push tells you about the
    # code you changed and never about the advisory published on Tuesday.
    - cron: '17 4 * * 1'

# Cancel a superseded analysis, as the test workflow already does. Several
# sessions commit to this repo in a day.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # The only write this workflow needs. `contents: read` is not the default
      # once any permission is named, so it is named.
      security-events: write
      contents: read
      actions: read

    strategy:
      # One language failing should not hide the results of the other two.
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The default suite is the quiet one. This project's whole posture is
          # that a defensible result is worth more than a convenient one, and
          # the extended suite is where the request-forgery and path-traversal
          # queries live.
          queries: security-extended
          config: |
            paths-ignore:
              # Third-party minified builds, committed so the portal renders
              # with no internet (see the vendor README). Findings in ECharts
              # or D3 are not this project's to fix and not this project's to
              # dismiss — they belong upstream, and a hundred of them would
              # bury the ones that are ours.
              - pipeline/web/static/public/vendor

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
