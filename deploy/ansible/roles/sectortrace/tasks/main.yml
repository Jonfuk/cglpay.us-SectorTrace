---
# This is the privacy boundary for everything below it: 0750 root-owned, so
# no unprivileged account on the host can reach the rendered .env, the
# bootstrap SQL or the backups. Files inside can then carry whatever mode a
# container needs without that widening host access.
- name: Create the state directory
  ansible.builtin.file:
    path: "{{ state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create state directory tree (outside the git checkout)
  ansible.builtin.file:
    path: "{{ state_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    # /app/data is bind-mounted whole, so everything the pipeline writes
    # lands here rather than on a container's writable layer.
    - data
    # The raw archive: the audit trail behind every figure, and rebuildable
    # only by re-crawling every source at one request per two seconds. It is
    # used whenever the ARCHIVE_S3_* group is not configured.
    - data/raw
    - data/derived
    # Read from the host by the offsite backup script, so it has to be a
    # real path here rather than a Docker volume.
    - data/backups
    # Structured JSON logs, one file per module.
    - logs
  # PostgreSQL, Neo4j and Caddy state are deliberately NOT here — they live
  # in named Docker volumes. See the compose template for why.

# 0755, unlike everything else here. The postgres entrypoint re-execs itself
# as the `postgres` user before running these scripts, and that user has to
# be able to traverse the bind-mounted directory and read the file. Host
# secrecy comes from state_dir being 0750 above, which the container's view
# never inherits from.
- name: Create the Postgres init directory
  ansible.builtin.file:
    path: "{{ state_dir }}/postgres-init"
    state: directory
    mode: "0755"

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ state_dir }}/.env"
    mode: "0600"

- name: Render Postgres role-bootstrap SQL (only applied on first init by the image)
  ansible.builtin.template:
    src: postgres-init-roles.sql.j2
    dest: "{{ state_dir }}/postgres-init/01-roles.sql"
    # Readable by the in-container postgres user, per the directory note
    # above. Not a widening of host access: state_dir is 0750.
    mode: "0644"

- name: Render the always-on stack's docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.selfhost.yml.j2
    dest: "{{ state_dir }}/docker-compose.yml"
    mode: "0644"
  register: sectortrace_main_compose

- name: Render the on-demand documents-worker compose file
  ansible.builtin.template:
    src: docker-compose.documents.yml.j2
    dest: "{{ state_dir }}/docker-compose.documents.yml"
    mode: "0644"

# Rendered whether or not the assistant is provisioned, so the file is there
# the day someone sets assistant_runtime_enabled. Nothing starts from it
# unless that is true — see the bring-up block after the health gate.
- name: Render the assistant model-runtime compose file
  ansible.builtin.template:
    src: docker-compose.assistant.yml.j2
    dest: "{{ state_dir }}/docker-compose.assistant.yml"
    mode: "0644"

- name: Render the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ state_dir }}/Caddyfile"
    mode: "0644"
  register: sectortrace_caddyfile

# Installed here, before anything is built or started, rather than after the
# health check. It is the tool you most want when the stack is NOT up — and
# putting it last meant a failed deploy left the box without it, so the
# operator fell back to ./start.sh, which is the local-development path and
# wants uv and a Python environment this host deliberately does not have.
- name: Install a `sectortrace` command for the host
  ansible.builtin.template:
    src: sectortrace-wrapper.sh.j2
    dest: /usr/local/bin/sectortrace
    mode: "0755"

- name: Build the warehouse PostgreSQL image
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml build postgres
    chdir: "{{ state_dir }}"
  changed_when: true

- name: Build the app image
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml build app
    chdir: "{{ state_dir }}"
  changed_when: true

- name: Build the documents-worker image
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.documents.yml build documents
    chdir: "{{ state_dir }}"
  changed_when: true

# Wrapped so a service that fails to start reports *why* here, rather than
# "dependency failed to start: container is unhealthy" and a manual
# `docker compose logs` to find out what actually happened.
- name: Bring up the always-on stack (postgres, neo4j, app, caddy)
  block:
    - name: Start the stack
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml up -d
        chdir: "{{ state_dir }}"
      changed_when: true
  rescue:
    - name: Collect logs from the stack
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml logs --tail=60 --no-color
        chdir: "{{ state_dir }}"
      register: sectortrace_failure_logs
      changed_when: false
      failed_when: false

    - name: Report what the containers said
      ansible.builtin.fail:
        msg: >-
          {{ ['The stack failed to start. Container logs follow.', '']
             + (sectortrace_failure_logs.stdout_lines | default(['(no logs available)'])) }}

- name: Reload Caddy if only its config changed
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ state_dir }}"
  when: sectortrace_caddyfile.changed and not sectortrace_main_compose.changed
  changed_when: true
  failed_when: false

# The stack being "up" is not the same as the app serving. This is the
# check that would have caught a bad migration, a wrong DATABASE_URL, or a
# Postgres that started and then refused connections — each of which leaves
# `docker compose ps` looking fine.
- name: Wait for the app to report healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:1801/health
    status_code: 200
  register: sectortrace_health
  retries: 30
  delay: 5
  until: sectortrace_health.status is defined and sectortrace_health.status == 200
  failed_when: sectortrace_health.status is not defined or sectortrace_health.status != 200

# The one-time catch-up of document_embeddings.embedding_vec for rows that
# predate migration 0071. Deliberately *after* the health gate, never inside
# `pipeline migrate`: on a populated warehouse this fills six figures of rows
# and builds the pgvector HNSW index, and that must not sit between the app
# starting and it serving — that coupling failed a mirror's health gate once
# (see pipeline/db.py:apply_migrations). Idempotent and resume-safe: a no-op
# once every row has its vector, and `nlp embed` writes embedding_vec inline
# for rows built after 0071, so this only ever clears the pre-0071 backlog.
- name: Backfill pgvector embedding_vec (one-time; a no-op once filled)
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml exec -T app python -m pipeline nlp backfill-vectors
    chdir: "{{ state_dir }}"
  register: sectortrace_backfill
  changed_when: false

# --- Local analyst assistant model runtime (BETA-107) ----------------------
# Only when this box provisions it. Ollama serves the LFM synthesis model
# and the same weights aliased to the router's tag; the app reaches both at
# http://ollama:11434 on the compose network. Enabling the feature itself
# (ASSISTANT_ENABLED) is still a separate, gated step — see docs/assistant.md.
- name: Bring up the assistant model runtime
  when: assistant_runtime_enabled
  block:
    - name: Start Ollama
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.assistant.yml up -d
        chdir: "{{ state_dir }}"
      changed_when: true

    - name: Wait for Ollama to answer
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.assistant.yml exec -T ollama ollama list
        chdir: "{{ state_dir }}"
      register: sectortrace_ollama_ready
      retries: 20
      delay: 3
      until: sectortrace_ollama_ready.rc == 0
      changed_when: false

    # `ollama pull` of a missing manifest can exit 0 with the error only in
    # the streamed body (a wrong assistant_lfm_ollama_ref does exactly this),
    # so check the output too, not just rc. The reference must exist on
    # ollama.com — `ollama.com/library/lfm2` is a 24B model, not this one.
    - name: Pull the LFM model (a no-op once current)
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.assistant.yml exec -T ollama ollama pull {{ assistant_lfm_ollama_ref }}
        chdir: "{{ state_dir }}"
      register: sectortrace_ollama_pull
      changed_when: "'success' in sectortrace_ollama_pull.stdout or 'pulling' in sectortrace_ollama_pull.stdout"
      failed_when: >-
        sectortrace_ollama_pull.rc != 0
        or 'Error:' in (sectortrace_ollama_pull.stdout + sectortrace_ollama_pull.stderr)
        or 'file does not exist' in (sectortrace_ollama_pull.stdout + sectortrace_ollama_pull.stderr)

    # No `ollama cp` alias: env.j2 sets ASSISTANT_LFM_MODEL /
    # ASSISTANT_NEEDLE_MODEL to assistant_lfm_ollama_ref, so the string the
    # app sends is the exact name Ollama pulled — nothing to rename, and the
    # ledger records the model that actually answered.
    - name: Confirm Ollama now has the model
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.assistant.yml exec -T ollama ollama show {{ assistant_lfm_ollama_ref }}
        chdir: "{{ state_dir }}"
      changed_when: false
  rescue:
    - name: Collect Ollama logs
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.assistant.yml logs --tail=60 --no-color
        chdir: "{{ state_dir }}"
      register: sectortrace_ollama_failure_logs
      changed_when: false
      failed_when: false

    - name: Report what Ollama said
      ansible.builtin.fail:
        msg: >-
          {{ ['The assistant model runtime failed to start or provision.', '',
              'Pull (' ~ assistant_lfm_ollama_ref ~ '):']
             + (sectortrace_ollama_pull.stdout_lines | default(['(pull task did not run)']))
             + (sectortrace_ollama_pull.stderr_lines | default([]))
             + ['', 'Ollama container logs:']
             + (sectortrace_ollama_failure_logs.stdout_lines | default(['(no logs available)'])) }}

- name: Install the offsite backup script
  ansible.builtin.template:
    src: sectortrace-backup-offsite.sh.j2
    dest: /usr/local/bin/sectortrace-backup-offsite
    # Carries the bucket credentials, so it is readable only by root — the
    # same reasoning as .env's 0600.
    mode: "0700"
  when:
    - backup_offsite_enabled
    - vault_archive_s3_bucket | length > 0

- name: Install the backup systemd unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - sectortrace-backup.service
    - sectortrace-backup.timer
  notify: Reload systemd

- name: Enable and start the backup timer
  ansible.builtin.service:
    name: sectortrace-backup.timer
    enabled: true
    state: started
