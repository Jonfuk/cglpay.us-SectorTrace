---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - fail2ban
      - unattended-upgrades
      - ufw
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: enable_unattended_upgrades

- name: Enable and start fail2ban (SSH brute-force protection)
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: enable_fail2ban

- name: Add 2GB swapfile on the NVMe
  block:
    - name: Check for existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create swapfile
      ansible.builtin.command: fallocate -l 2G /swapfile
      when: not swapfile_stat.stat.exists

    - name: Secure swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
      when: not swapfile_stat.stat.exists

    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swapfile
      ansible.builtin.command: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Persist swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present
  # Insurance against an occasional document-processing spike (Docling's
  # layout models are torch-based), not a working-memory strategy — see the
  # deployment README for why this box budgets RAM the way it does.
