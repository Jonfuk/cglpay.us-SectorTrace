---
# Bring the base OS current and give it the handful of things every later
# role assumes. Runs before docker/tuning/hardening/sectortrace.

# Debian 12+ ships needrestart, which prompts interactively when a library
# upgrade means a service should restart. Under Ansible that prompt has
# nowhere to go and the dist-upgrade below hangs forever. Set it to
# automatic *before* the first upgrade rather than discovering that on a
# fresh box at 2am.
- name: Ensure the needrestart drop-in directory exists
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: "0755"
  failed_when: false

- name: Configure needrestart to act without prompting
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/99-ansible.conf
    content: |
      # Managed by Ansible — see roles/common/tasks/main.yml
      $nrconf{restart} = 'a';
      $nrconf{kernelhints} = 0;
    mode: "0644"
  failed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade every package on the box
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
  when: apt_full_upgrade
  # A fresh VPS image is typically weeks-to-months behind. This is the one
  # task in the playbook that can pull a new kernel and therefore want a
  # reboot; site.yml checks /var/run/reboot-required at the end and tells
  # you rather than rebooting the box out from under you.

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages + extra_packages }}"
    state: present

# tmux is the one that matters operationally here: a document-processing
# batch or a full collection run outlives an SSH session, and losing the
# connection halfway through one otherwise kills it. These two settings are
# the ones people immediately miss without them.
- name: Provide a usable default tmux configuration
  ansible.builtin.copy:
    dest: /etc/tmux.conf
    mode: "0644"
    content: |
      # Managed by Ansible — see roles/common/tasks/main.yml
      # A batch scrolls a lot more than the 2000-line default holds.
      set -g history-limit 50000
      set -g mouse on
      set -g default-terminal "screen-256color"
      # Status line worth reading on a server you visit occasionally.
      set -g status-left '#[fg=green]#H #[fg=default]| '
      set -g status-right '%Y-%m-%d %H:%M UTC'
      setw -g automatic-rename on

# Debian installs sysstat with collection switched off, so `sar` reports
# nothing until this is flipped — and the moment you want performance
# history is always after the incident, not before it.
- name: Enable sysstat collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Restart sysstat

# Every row in this warehouse records when it was fetched, and a backup
# manifest is stamped with the time it was taken. A box whose clock has
# drifted writes provenance that quietly disagrees with the source's own
# timestamps, so NTP here is a data-integrity concern rather than a nicety.
- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Enable and start chrony (NTP)
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started

# An unbounded journal on a box that runs for a year fills the disk, and
# the failure mode is everything stopping at once.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Bound the systemd journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-sectortrace.conf
    content: |
      # Managed by Ansible — see roles/common/tasks/main.yml
      [Journal]
      SystemMaxUse=1G
      SystemKeepFree=2G
      MaxRetentionSec=1month
    mode: "0644"
  notify: Restart journald

- name: Add swapfile
  # Insurance against an occasional document-processing spike, not a
  # working-memory strategy — vm.swappiness in the tuning role keeps the
  # kernel off it under normal load. See the README's RAM budget.
  when: swapfile_size | length > 0
  block:
    - name: Check for an existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: common_swapfile_stat

    - name: Allocate the swapfile
      ansible.builtin.command: "fallocate -l {{ swapfile_size }} /swapfile"
      args:
        creates: /swapfile
      when: not common_swapfile_stat.stat.exists

    - name: Secure swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format the swapfile
      ansible.builtin.command: mkswap /swapfile
      when: not common_swapfile_stat.stat.exists
      changed_when: true

    - name: Enable the swapfile
      ansible.builtin.command: swapon /swapfile
      when: not common_swapfile_stat.stat.exists
      changed_when: true

    - name: Persist the swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present
