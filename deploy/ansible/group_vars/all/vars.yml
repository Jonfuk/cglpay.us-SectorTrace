---
# Non-secret configuration. Secrets (passwords, API keys, S3 credentials)
# live in vault.yml, which is ansible-vault encrypted — see
# group_vars/all/vault.yml.example.

# --- Domain -----------------------------------------------------------------
# The A record you're pointing at this VPS. Caddy requests a Let's Encrypt
# certificate for it automatically the first time it starts — the record
# must already resolve to this box's IP before that first run, or the ACME
# HTTP-01 challenge fails.
domain: "example.org"

# The email Caddy gives Let's Encrypt for expiry notices, and the
# CONTACT_EMAIL sent in every source's User-Agent per settled decision 5.
# Kept here rather than only in vault.yml because it isn't a secret; move it
# there instead if you'd rather not have it in plaintext git history.
contact_email: "{{ vault_contact_email }}"

# --- Where generated state lives ---------------------------------------------
# Deliberately outside the git checkout (repo_root), matching the project's
# own "never write into the repo" rule for anything generated at runtime:
# .env, the rendered docker-compose.yml, Postgres/Neo4j data volumes, and
# local backups all live here instead.
state_dir: /opt/sectortrace/state

# --- The operator UI -----------------------------------------------------------
# The app has no authentication of its own (settled decision 8), so /admin
# and /api/admin/* are not served to the open internet. Two ways to reach
# them, in increasing order of exposure:
#
#  1. An SSH tunnel to the app's loopback-only port. Nothing is exposed:
#       ssh -L 1801:127.0.0.1:1801 <user>@<this-vps> -N
#       open http://127.0.0.1:1801/admin
#
#  2. admin_allowed_ips below — Caddy serves /admin over HTTPS to these
#     source addresses and 403s everyone else.
#
# Anything not in the list still gets 403. Set expose_admin_publicly: true
# to drop the restriction entirely; think hard before you do.
admin_ui_enabled: true
expose_admin_publicly: false

# Source addresses allowed through to /admin and /api/admin/*. CIDR ranges
# are accepted too (198.51.100.0/24).
#
# Understand what this trades before adding to it. The admin UI decides
# review-queue items and can read restricted_ tables, and it has no login of
# any kind — the allowlist IS the authentication. So:
#   * If this address is a home broadband line, it can change without
#     warning, and whoever the ISP gives it to next inherits your access.
#   * TLS protects it in transit; nothing protects it if the address is
#     wrong.
# An empty list means admin is reachable only through the SSH tunnel, which
# remains the safer option.
admin_allowed_ips:
  - "154.61.155.48"

# --- Resource sizing -------------------------------------------------------------
# Derived from the host's actual RAM and CPU count, so the same playbook
# suits a 4GB box and a 16GB one without editing. The preflight role asserts
# the resulting budget fits before anything is built.
#
# To pin a value by hand, set auto_tune_memory: false and fill in the
# explicit block below, or just override the individual variable in
# group_vars/all/zz-local.yml (which loads last and wins).
auto_tune_memory: true

# What the OS, the app process, Caddy and a document batch need left over.
# The larger of 1GB or 15% of RAM: a percentage alone starves a small box,
# a fixed figure alone wastes a large one.
reserved_mb: "{{ [1024, (ansible_memtotal_mb | int * 0.15) | int] | max }}"

# PostgreSQL. shared_buffers at the conventional 25%, floored so a small box
# still gets a usable cache and capped because past ~8GB the OS page cache
# serves this workload better than more shared_buffers would.
postgres_shared_buffers_mb: "{{ [[(ansible_memtotal_mb | int * 0.25) | int, 256] | max, 8192] | min }}"
# Not an allocation — it tells the planner how much cache it can assume
# exists, counting the OS page cache.
postgres_effective_cache_mb: "{{ (ansible_memtotal_mb | int * 0.5) | int }}"
# Per sort/hash node, not per connection, so a complex query can use several
# times this. Kept deliberately small: max_connections of these at once is
# the number that has to fit.
postgres_work_mem_mb: "{{ [[(ansible_memtotal_mb | int * 0.00125) | int, 4] | max, 32] | min }}"
# VACUUM and index builds. Few run at once, so this can be generous.
postgres_maintenance_work_mem_mb: "{{ [[(ansible_memtotal_mb | int * 0.05) | int, 64] | max, 1024] | min }}"
postgres_max_connections: 100
# /dev/shm for parallel workers — not the buffer pool, which is anonymous
# mmap. Docker's 64MB default is what bites. Kept at least maintenance_work_mem
# with headroom: a parallel index build reserves a /dev/shm segment that size
# up front (pgvector's HNSW build did exactly this and a flat 256MB
# under-provisioned it against a tuned maintenance_work_mem — see
# migrations/postgres/0071). The migrations now build serially so they no
# longer depend on this, but a manual REINDEX still would.
postgres_shm_size_mb: "{{ (postgres_maintenance_work_mem_mb | int) + 256 }}"

# Neo4j is a disposable projection rebuilt from the warehouse, so it gets a
# deliberately modest share: the warehouse is what must never be slow.
neo4j_heap_mb: "{{ [[(ansible_memtotal_mb | int * 0.12) | int, 512] | max, 4096] | min }}"
neo4j_pagecache_mb: "{{ [(neo4j_heap_mb | int * 0.5) | int, 256] | max }}"

# Parallelism from the CPU count.
postgres_max_worker_processes: "{{ ansible_processor_vcpus | int }}"
postgres_max_parallel_workers: "{{ ansible_processor_vcpus | int }}"
postgres_max_parallel_workers_per_gather: "{{ [(ansible_processor_vcpus | int / 2) | int, 2] | max }}"
# Document parsing is CPU-bound; half the cores leaves the box responsive
# and the database served while a batch runs.
document_worker_concurrency: "{{ [[(ansible_processor_vcpus | int / 2) | int, 1] | max, 4] | min }}"

# The strings the templates actually use. Override these directly if you set
# auto_tune_memory: false.
postgres_shared_buffers: "{{ postgres_shared_buffers_mb }}MB"
postgres_effective_cache_size: "{{ postgres_effective_cache_mb }}MB"
postgres_work_mem: "{{ postgres_work_mem_mb }}MB"
postgres_maintenance_work_mem: "{{ postgres_maintenance_work_mem_mb }}MB"
neo4j_heap_size: "{{ neo4j_heap_mb }}m"
neo4j_pagecache_size: "{{ neo4j_pagecache_mb }}m"

# Container memory ceilings. Not a performance setting — a blast radius one.
# A document batch that runs away hits its own cgroup limit and is killed
# alone, instead of the kernel's OOM killer picking a victim host-wide and
# possibly choosing PostgreSQL. Postgres additionally gets a negative
# oom_score_adj so it is the last thing the kernel considers.
documents_mem_limit_mb: "{{ [[(ansible_memtotal_mb | int * 0.5) | int, 1024] | max, 8192] | min }}"
neo4j_mem_limit_mb: "{{ (neo4j_heap_mb | int) + (neo4j_pagecache_mb | int) + 768 }}"

# --- Packages -------------------------------------------------------------------
# Everything the roles below assume, plus the standard operator toolkit.
# Add your own preferences to extra_packages rather than editing this list,
# so a `git pull` doesn't conflict with your changes.
base_packages:
  # Required by the roles in this playbook
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
  - chrony

  # Session persistence. A collection run or a document batch outlives an
  # SSH connection; without this, a dropped link kills it.
  - tmux

  # What's running, what's eating RAM, what's eating disk
  - htop
  - iotop
  - ncdu
  - tree
  - lsof
  # sar/iostat: performance *history*, so "it was slow an hour ago" is a
  # question with an answer rather than a shrug.
  - sysstat

  # Files and transfers
  - mc
  - rsync
  - unzip
  - zip
  - less
  - vim

  # Network diagnosis. dnsutils earns its place on this box specifically:
  # `dig {{ domain }}` is how you confirm the A record actually points here
  # before Caddy's first Let's Encrypt request depends on it.
  - dnsutils
  - net-tools
  - mtr-tiny

  # jq: the exports, provenance sidecars and health endpoints in this
  # project are all JSON.
  - jq

  - bash-completion

  # Copies verified snapshots off the box after each backup. Debian's
  # awscli talks to any S3-compatible endpoint via --endpoint-url.
  - awscli

# Yours. Empty by default.
extra_packages: []

# --- Preflight ------------------------------------------------------------------
# The preflight role refuses to continue if the domain doesn't resolve to
# this box (and isn't explained by a proxy — see behind_cloudflare below).
skip_dns_check: false

# --- Cloudflare ------------------------------------------------------------------
# "auto" resolves the domain and decides: an address inside Cloudflare's
# published ranges means the record is proxied (orange cloud); anything else
# means DNS-only (grey cloud) and traffic reaches this box directly.
# Force it with true/false if you'd rather not have it inferred.
#
# This is not cosmetic. With the record proxied, every connection arrives
# from a Cloudflare address, so a `remote_ip` allowlist matches Cloudflare
# rather than you — admin_allowed_ips would lock *everyone* out of /admin,
# including you. When proxied, Caddy is instead told to trust these ranges
# and match on `client_ip`, which reads the real address out of
# X-Forwarded-For. Trusting them is what makes that header believable, and
# is why the range list has to be right: any address allowed to set
# X-Forwarded-For can claim to be any client.
behind_cloudflare: "auto"

# What the templates actually read. The preflight role overrides this with
# set_fact (which outranks group_vars); this default exists so the
# sectortrace role still renders if you run it alone with --tags.
caddy_behind_cloudflare: false

# From https://www.cloudflare.com/ips/ — refresh from there occasionally.
# Rarely changed, but this list is a security boundary when proxied, so it
# is written out rather than fetched at run time from a source that could
# be intercepted.
cloudflare_ipv4_ranges:
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
cloudflare_ipv6_ranges:
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

# Rehearse a deployment against Let's Encrypt's staging endpoint. The
# certificate will not be trusted by browsers, but failures cost nothing
# against the real rate limit (5 per hostname per hour, which a couple of
# hopeful re-runs can exhaust).
caddy_use_staging_ca: false

# --- OS upgrade ----------------------------------------------------------------
# Full `apt-get dist-upgrade` on every run. A fresh VPS image is usually
# weeks behind, and this is the only task that can pull a new kernel — the
# play reports a pending reboot at the end rather than taking one itself.
apt_full_upgrade: true

# --- Tuning ---------------------------------------------------------------------
# Swap is insurance against a document-processing spike, not working memory.
# Set to "" to skip creating one entirely.
swapfile_size: "2G"
# Low, not zero: keep the kernel off swap under normal load while leaving it
# able to page out genuinely cold memory instead of invoking the OOM killer.
vm_swappiness: 10

# --- Hardening --------------------------------------------------------------------
enable_fail2ban: true
enable_unattended_upgrades: true
ssh_port: 22

# Applies the SSH drop-in: modern ciphers/KEX/MACs, MaxAuthTries 3, short
# login grace, no X11 or agent forwarding.
#
# It does NOT disable password authentication — that is deliberate and the
# template says so. TCP forwarding also stays on, because the admin-UI
# tunnel depends on it.
harden_ssh: true

# Root login mode, passed straight through to sshd's PermitRootLogin. `yes`
# here for the same reason password auth stays on — this box must stay
# reachable for root without a key on it. Set `prohibit-password` on a
# deployment that keeps a key on every box that needs root (the mirror does,
# and does set it).
sshd_permit_root_login: "yes"

# These carry real weight given password login stays enabled. A day-long ban
# after 4 tries in 10 minutes costs a legitimate typo-ing operator very
# little (add your IP to fail2ban_ignoreip) and makes password guessing
# impractical.
fail2ban_bantime: "24h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 4

# The recidive jail: an address banned this many times inside findtime gets
# a week rather than a day.
recidive_bantime: "1w"
recidive_findtime: "1d"
recidive_maxretry: 3
# Never banned, so a mistyped password can't lock you out of your own box.
fail2ban_ignoreip:
  - "154.61.155.48"

# Security updates install automatically either way; this decides whether
# the box may reboot itself to finish one. Off by default: a reboot mid-run
# loses an in-flight collection.
unattended_upgrades_reboot: false
unattended_upgrades_reboot_time: "04:00"

# Daily verified application-level backup (pipeline backup --keep N), on top
# of the VPS provider's own daily snapshots. Writes to
# {{ state_dir }}/data/backups, which is outside both the git checkout and
# the Postgres data volume.
backup_keep: 7
backup_time: "03:15"

# Copy each verified snapshot off the box after it is taken. A backup on the
# same disk as the warehouse covers operator error and corruption, and
# nothing at all about losing the disk — the provider's own snapshots are
# the other half of that, but they are not application-consistent and this
# one is verified.
#
# Reuses the archive bucket's credentials by default, under a prefix of its
# own; set the backup_s3_* overrides to use a different bucket, which is
# better still (a credential leak that can delete the archive should not
# also be able to delete its backups).
backup_offsite_enabled: true
backup_s3_prefix: "warehouse-backups"
backup_s3_bucket: ""
backup_s3_endpoint: ""
backup_s3_region: ""
backup_s3_access_key: ""
backup_s3_secret: ""

# --- Local analyst assistant (BETA-107) ---------------------------------------
# The optional natural-language operator finding aid, off by default and
# never on Railway (docs/assistant.md). Two switches, because provisioning
# the model runtime and authorising the feature are different decisions:
#
#   assistant_runtime_enabled  stands up a single Ollama (its own compose
#                              file), builds the `openai` extra into the app
#                              image, and points ASSISTANT_OLLAMA_URL /
#                              ASSISTANT_NEEDLE_URL at it.
#   assistant_app_enabled      writes ASSISTANT_ENABLED=true. Do NOT set this
#                              until `pipeline nlp assistant-eval` reports
#                              gate.may_enable: true — a provisioned runtime
#                              is not an enabled feature.
assistant_runtime_enabled: false
assistant_app_enabled: false

# One Ollama serves both roles the assistant calls. It pulls this reference
# (ollama.com/library/lfm2) once, then `ollama cp`s it to the two model
# strings pipeline/assistant/adapters.py sends — LFM_MODEL for synthesis and
# NEEDLE_MODEL for the router — so a request for either resolves to the same
# weights. Provenance note: the library model is LFM2; the code and
# docs/assistant.md pin "LFM2.5" and quant Q4_K_M. The alias bridges the
# name; assistant_runs.lfm_model still records the pinned constant. Serve a
# real LFM2.5 GGUF here instead if that gap matters.
assistant_lfm_ollama_ref: "lfm2:1.2b"
assistant_lfm_model_tag: "LiquidAI/LFM2.5-1.2B-Instruct"
assistant_needle_model_tag: "needle-2"

# Pinned like every other image here (neo4j:5-community, caddy:2-alpine).
# Bump deliberately; lfm2 needs a build recent enough to know the
# architecture. A wrong tag fails cleanly at `docker compose pull` and
# breaks nothing already running.
assistant_ollama_image: "ollama/ollama:0.6.0"

# A ceiling, not a reservation — the same blast-radius reasoning as
# documents_mem_limit_mb. Inference of a 1.2B Q4 model sits well inside this.
# NOT part of the preflight role's RAM budget: that role predates this
# service and does not know to reserve for it, so leave headroom yourself on
# a box that also runs a document worker.
assistant_ollama_mem_limit_mb: "{{ [[(ansible_memtotal_mb | int * 0.2) | int, 1536] | max, 4096] | min }}"
