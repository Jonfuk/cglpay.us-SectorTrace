# Same shape as the self-host build: the mirror provisions the box it runs
# on. Clone the repo onto the mirror VPS, run ansible-mirror.sh there, and
# it targets localhost over a local connection rather than SSH.
#
# The one machine this playbook does reach over the network is the *source*
# deployment, and it does that as the running mirror (an S3 read or an SSH
# tunnel), never as an Ansible host.
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
