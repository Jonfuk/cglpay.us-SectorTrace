---
# Non-secret configuration for a *mirror* of an existing SectorTrace
# deployment. Secrets — this box's own database passwords, and the source
# deployment's credentials — live in vault.yml, which is ansible-vault
# encrypted; see group_vars/all/vault.yml.example.
#
# Everything down to "The source deployment" is the self-host build's
# vars.yml, because six of the seven roles are shared with it and expect
# these names. Where a value differs from that build, the comment says why.

# --- Domain -----------------------------------------------------------------
# The A record for THIS box — the mirror's own hostname, not the source
# deployment's. Caddy requests a Let's Encrypt certificate for it the first
# time it starts, so the record must already resolve here.
domain: "example.org"

# The email Caddy gives Let's Encrypt for expiry notices, and CONTACT_EMAIL
# in the container. A mirror never crawls a source, so the User-Agent half
# of settled decision 5 does not arise here — the application still refuses
# to start without it, and an operator contact on a public portal is right
# either way.
contact_email: "{{ vault_contact_email }}"

# --- Where generated state lives ---------------------------------------------
# Deliberately NOT /opt/sectortrace/state, which is where the self-host
# build puts a source deployment. The two are different things with
# identically-named files inside them, and a box that has been both would
# otherwise leave you reading a .env that belongs to the other one.
state_dir: /opt/sectortrace-mirror/state

# --- The operator UI -----------------------------------------------------------
# Served here, with the same allowlist as the source deployment, and with
# one thing to understand that does not apply there:
#
#   THE WAREHOUSE IS REPLACED WHOLESALE ON EVERY SYNC.
#
# A review-queue decision, a promotion or a reveal made on the mirror is
# gone at the next nightly run — not merged, not conflicted, gone. The
# mirror is a copy; the source deployment is where evidence work happens.
# Read the admin UI here freely. Do not work in it.
#
# Set admin_ui_enabled: false to close it entirely, which is the honest
# setting if nobody needs to look.
admin_ui_enabled: true
expose_admin_publicly: false

# Source addresses allowed through to /admin and /api/admin/*. CIDR ranges
# are accepted too (198.51.100.0/24). The allowlist IS the authentication —
# the app has no login of any kind (settled decision 8) — so the self-host
# build's warnings apply here unchanged: a home broadband address can change
# without warning, and TLS protects this in transit but not from a wrong
# address. An empty list leaves admin reachable only over an SSH tunnel.
admin_allowed_ips:
  - "154.61.155.48"

# --- Direct PostgreSQL access ---------------------------------------------------
# Source addresses allowed to open a PostgreSQL connection to this box on
# 5432. Empty (the default the self-host build has) keeps PostgreSQL bound to
# 127.0.0.1 in docker-compose.yml — reachable only from on the box or through
# an SSH tunnel. Listing an address here, on the next playbook run:
#
#   * publishes the container's 5432 on all IPv4 interfaces
#     (docker-compose.mirror.yml.j2), and
#   * writes an accept rule for that address into the DOCKER-USER iptables
#     chain, with a default-drop for every other off-box source on the public
#     interface. It has to be iptables, not ufw: a published Docker port does
#     not pass through ufw at all (deploy/ansible/README.md, "What ufw doesn't
#     cover"). sectortrace-mirror-pg-firewall(.service) owns those rules and
#     re-applies them at boot.
#
# CIDR ranges are accepted (198.51.100.0/24). This is a genuine exposure and
# a weaker boundary than the SSH tunnel the sync modes use:
#
#   * a home broadband address changes without warning — when it does, the
#     rule points at whoever holds it next;
#   * the connection is a straight TCP session to PostgreSQL. The password is
#     not sent in clear (scram-sha-256 on the postgres:18 image), but nothing
#     here terminates TLS in front of 5432, so the traffic itself is not
#     encrypted. Use an SSH tunnel or a VPN if that matters.
#
# The role still authenticates every session with a role password; this list
# only decides which source addresses may attempt one. Prefer the read-only
# role (sectortrace_reader / DATABASE_RO_URL) for any external client that
# only reads.
postgres_external_allowed_ips:
  - "154.61.155.48"

# The interface the default-drop above matches on — genuinely external
# inbound traffic, so on-box and container-to-container connections to 5432
# (the sync container runs network_mode: host and dials 127.0.0.1:5432) are
# never caught by it. Defaults to this box's primary interface; override in
# zz-local.yml only on a multi-homed host where the default route is not the
# interface the listed clients arrive on.
postgres_public_interface: "{{ ansible_default_ipv4.interface | default('') }}"

# --- Resource sizing -------------------------------------------------------------
# Derived from the host's actual RAM and CPU count, exactly as in the
# self-host build — the shared preflight role asserts the budget fits before
# anything is built. A mirror runs the same PostgreSQL and Neo4j as the
# deployment it copies, so the sizing is the same question.
#
# To pin a value by hand, set auto_tune_memory: false and override the
# individual variable in group_vars/all/zz-local.yml (which loads last).
auto_tune_memory: true

reserved_mb: "{{ [1024, (ansible_memtotal_mb | int * 0.15) | int] | max }}"

postgres_shared_buffers_mb: "{{ [[(ansible_memtotal_mb | int * 0.25) | int, 256] | max, 8192] | min }}"
postgres_effective_cache_mb: "{{ (ansible_memtotal_mb | int * 0.5) | int }}"
postgres_work_mem_mb: "{{ [[(ansible_memtotal_mb | int * 0.00125) | int, 4] | max, 32] | min }}"
postgres_maintenance_work_mem_mb: "{{ [[(ansible_memtotal_mb | int * 0.05) | int, 64] | max, 1024] | min }}"
postgres_max_connections: 100
# /dev/shm for parallel workers. Kept at least maintenance_work_mem with
# headroom: a parallel index build reserves a /dev/shm segment that size up
# front (pgvector's HNSW build did exactly this and a flat 256MB
# under-provisioned it against a tuned maintenance_work_mem, crash-looping the
# app during `pipeline migrate` — see migrations/postgres/0071). The migrations
# now build serially so they no longer depend on this, but a manual REINDEX
# still would.
postgres_shm_size_mb: "{{ (postgres_maintenance_work_mem_mb | int) + 256 }}"

neo4j_heap_mb: "{{ [[(ansible_memtotal_mb | int * 0.12) | int, 512] | max, 4096] | min }}"
neo4j_pagecache_mb: "{{ [(neo4j_heap_mb | int * 0.5) | int, 256] | max }}"

postgres_max_worker_processes: "{{ ansible_processor_vcpus | int }}"
postgres_max_parallel_workers: "{{ ansible_processor_vcpus | int }}"
postgres_max_parallel_workers_per_gather: "{{ [(ansible_processor_vcpus | int / 2) | int, 2] | max }}"
document_worker_concurrency: "{{ [[(ansible_processor_vcpus | int / 2) | int, 1] | max, 4] | min }}"

postgres_shared_buffers: "{{ postgres_shared_buffers_mb }}MB"
postgres_effective_cache_size: "{{ postgres_effective_cache_mb }}MB"
postgres_work_mem: "{{ postgres_work_mem_mb }}MB"
postgres_maintenance_work_mem: "{{ postgres_maintenance_work_mem_mb }}MB"
neo4j_heap_size: "{{ neo4j_heap_mb }}m"
neo4j_pagecache_size: "{{ neo4j_pagecache_mb }}m"

documents_mem_limit_mb: "{{ [[(ansible_memtotal_mb | int * 0.5) | int, 1024] | max, 8192] | min }}"
neo4j_mem_limit_mb: "{{ (neo4j_heap_mb | int) + (neo4j_pagecache_mb | int) + 768 }}"

# --- Packages -------------------------------------------------------------------
# The self-host build's list. `awscli` is load-bearing on a mirror rather
# than optional: it is how the nightly sync reads the source's snapshot
# bucket. Add your own preferences to extra_packages.
base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
  - chrony
  - tmux
  - htop
  - iotop
  - ncdu
  - tree
  - lsof
  - sysstat
  - mc
  - rsync
  - unzip
  - zip
  - less
  - vim
  - dnsutils
  - net-tools
  - mtr-tiny
  - jq
  - bash-completion
  # Reads the source deployment's S3 buckets on every sync. Debian's awscli
  # talks to any S3-compatible endpoint via --endpoint-url.
  - awscli
extra_packages: []

# --- Preflight ------------------------------------------------------------------
skip_dns_check: false

# --- Cloudflare ------------------------------------------------------------------
# Detected, not assumed: an address inside Cloudflare's published ranges
# means the record is proxied, which changes how the admin allowlist has to
# be matched (client_ip rather than remote_ip). Getting this wrong in the
# proxied direction locks everyone out of /admin, including you.
behind_cloudflare: "auto"
caddy_behind_cloudflare: false

# From https://www.cloudflare.com/ips/ — refresh from there occasionally.
# A security boundary when proxied: anything trusted here can claim to be
# any client.
cloudflare_ipv4_ranges:
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
cloudflare_ipv6_ranges:
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

caddy_use_staging_ca: false

# --- OS upgrade ----------------------------------------------------------------
apt_full_upgrade: true

# --- Tuning ---------------------------------------------------------------------
swapfile_size: "2G"
vm_swappiness: 10

# --- Hardening --------------------------------------------------------------------
enable_fail2ban: true
enable_unattended_upgrades: true
ssh_port: 22
harden_ssh: true

# Differs from the self-host build (which keeps `yes`). A mirror is only ever
# reached by an operator who already has a key on it — there is no scenario
# where someone needs a root PASSWORD login to this box — so root is
# key-only here. Non-root password login is untouched (PasswordAuthentication
# stays `yes`), so a locked-out operator still has that way back in. `sshd -t`
# validates the drop-in before it is written.
sshd_permit_root_login: "prohibit-password"
fail2ban_bantime: "24h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 4
recidive_bantime: "1w"
recidive_findtime: "1d"
recidive_maxretry: 3
fail2ban_ignoreip:
  - "154.61.155.48"
unattended_upgrades_reboot: false
unattended_upgrades_reboot_time: "04:00"

# =============================================================================
#  The source deployment, and the sync
# =============================================================================
# Everything below here is what makes this a mirror rather than a second
# deployment. The credentials these name live in vault.yml.

# Only ever shown to a human — in the playbook's closing summary, in the
# sync log, and in `sectortrace-mirror sync-status`. Nothing connects to it.
# Set it to the source deployment's domain so a log line says which box a
# warehouse came from.
mirror_source_label: ""

# --- What this box is for -----------------------------------------------------
# "dr_mirror" (default) is everything below this point as originally
# written: a disaster-recovery copy, wiped and replaced wholesale on every
# sync, tracking whatever branch happens to be checked out.
#
# "beta" is the other thing this role can build: a box that pins a git
# branch (deploy_git_branch below) and re-fetches/resets to its tip on every
# playbook run, seeds its database from a source ONCE using the same three
# sync paths as a dr_mirror, and then — unlike a dr_mirror — is left alone.
# mirror_recurring_sync_enabled defaults to false in that case specifically
# so that testing writes on this box survive until you choose to reseed by
# hand (`sectortrace-mirror sync`), not until 04:30 the next morning.
# ansible-mirror.sh asks which of the two this box is; see its "What is this
# box for?" question.
mirror_role: "dr_mirror"   # "dr_mirror" or "beta"

# The branch this box builds and runs. Empty (the dr_mirror default) means
# "whatever is checked out here" — the historical behaviour, unchanged: a
# human runs `git pull` before re-running the playbook, as the README's
# "Redeploying" section describes. A beta deployment sets this so the
# playbook itself keeps the box's checkout pinned to the branch's tip on
# every run, discarding any local modifications on the box on purpose — see
# the "Pin this box's checkout" task in site.yml.
deploy_git_branch: ""

# Whether the sync timer fires nightly (dr_mirror's historical default,
# true) or the source is seeded once, by hand, and left alone (beta's
# default, set by the wizard). A database testing writes can't survive
# without vanishing at the next timer firing is not a testing database.
mirror_recurring_sync_enabled: "{{ mirror_role != 'beta' }}"

# --- Extra environment this role does not render ----------------------------
# env.j2 writes no module API keys, by design: a dr_mirror collects nothing
# and "a key that cannot be used is a key that should not be on the box"
# (see env.j2's closing note and the README's "What this box does not
# have"). A `beta` box is the exception the design already anticipates — a
# writable checkout you test a branch against, where a queue item may need
# to exercise one real collection module (`sectortrace-mirror run mNN_...`),
# and that needs the module's key.
#
# Those keys do not belong in the vault (it holds the SOURCE deployment's
# credentials, not this box's own) and cannot live in env.j2 (rendered from
# tracked files, overwritten every run). This is the third place: an
# operator-managed file beside the rendered .env, merged onto the end of it
# on every playbook run. Later definitions win — for Docker Compose's
# env_file and for pipeline/config.py's dotenv load alike — so a key here
# overrides the same key from env.j2. Absent, nothing changes.
#
# It sits in state_dir, NOT the checkout: the beta pre-task resets this
# box's tree to origin/<branch> every run, so the checkout is no place for a
# persistent local secret. state_dir is 0750 root-owned — the same privacy
# boundary .env itself relies on. See deploy/ansible-mirror/.env.merge.example.
mirror_env_merge_file: "{{ state_dir }}/.env.merge"

# How the warehouse gets here. All paths are built; this chooses which one
# the timer runs, and ansible-mirror.sh asks for it.
#
#   snapshot  Read the newest verified `pipeline backup` snapshot out of the
#             source's offsite backup bucket and `pipeline restore` it. The
#             source already writes those nightly (backup_offsite_enabled in
#             its own vars.yml). Needs no inbound access to the source box
#             at all — read-only keys on one bucket — and the snapshot has
#             already been verified once when it was written, and is
#             verified again by restore before it replaces anything. What it
#             costs: freshness is "as of the source's last backup".
#
#   tunnel    `pipeline migrate-postgres --truncate`, copying live from the
#             source's PostgreSQL over an SSH tunnel this box holds open,
#             and verifying the result row by row against the source. Fresher,
#             and verified against the live warehouse rather than against a
#             file. What it costs: an SSH key on the source box and a tunnel
#             to keep up.
#
#   url       `pipeline migrate-postgres --truncate`, copying live from a
#             PostgreSQL URL stored in the encrypted vault. Use this when the
#             source is a managed database such as Railway and is reachable
#             directly from this box; no SSH tunnel is needed.
mirror_sync_mode: "snapshot"

# Nightly, after the source's own backup (03:15) and its offsite copy have
# had time to finish. Too early and snapshot mode restores last night's file
# again — harmless (it is skipped as already-restored) but pointless.
mirror_sync_time: "04:30"
# Spreads the start so a bucket serving several mirrors is not asked for the
# same object by all of them at the same second.
mirror_sync_randomized_delay: "20m"

# The portal is stopped for the warehouse step and started again after it.
#
# Not politeness: the restore truncates every table and reloads it in one
# transaction, which takes an ACCESS EXCLUSIVE lock. Leaving the app up does
# not avoid the outage, it just turns it into requests that hang until the
# restore lets go — and a long-running portal query can hold the restore off
# instead. Stopping it makes the window explicit, and Caddy answers it with
# a 503 saying so rather than a bare 502.
mirror_stop_app_during_sync: true

# --- The raw archive: S3 -> this box's local disk ------------------------------
# The source deployment keeps archived source bytes in an S3 bucket. The
# mirror keeps them on its own disk, under {{ state_dir }}/data/raw, and the
# app here is configured with no ARCHIVE_S3_* group at all so it reads them
# from the filesystem — the archive is *on* this box, not proxied from the
# source's bucket.
#
# `pipeline archive-mirror` is what moves them: it downloads every object
# the local store is missing and never deletes a local file. It is
# incremental after the first run, but that first run downloads the entire
# archive, so expect one long night and check the disk before you start.
mirror_archive_sync: true

# Rebuild the evidence graph from the freshly restored warehouse, at the end
# of each sync. Neo4j is a disposable projection either way; on a mirror it
# is *entirely* disposable, since the warehouse it projects was replaced
# five minutes earlier. Turn this off (and NEO4J_ENABLED with it) if the
# mirror only needs to serve the portal.
mirror_graph_rebuild: true

# Rebuild the semantic-analysis layer (034*: document_chunks ->
# document_embeddings) from the freshly synced warehouse, in the on-demand
# documents worker — the only image on this box carrying the `nlp` extra.
#
# Off by default, and only worth turning on where the SOURCE deployment
# cannot embed: a managed source such as Railway does not ship the `nlp`
# extra, so document_embeddings arrives from every sync empty and semantic /
# hybrid search on this box has nothing to work with until something fills
# it. With this true the sync does, straight after the graph rebuild.
#
# The cost is real: `nlp embed` is resume-safe (it only touches chunks with
# no vector for the model) but the warehouse is replaced wholesale every
# sync, so on a box with recurring sync this re-embeds the whole corpus
# nightly. On a `beta` box (mirror_recurring_sync_enabled: false, seeded by
# hand) it is a one-off after each deliberate reseed, which is the case this
# was added for.
mirror_nlp_rebuild: false

# The embedder `mirror_nlp_rebuild` passes to `pipeline nlp embed --model`.
# A sentence-transformers id (downloaded on first use into
# {{ state_dir }}/nlp-cache and kept there), or "stub" for the deterministic
# dependency-free stand-in — which needs no weights but is not a real
# retriever, so it is only useful for proving the path end to end.
mirror_nlp_embed_model: "sentence-transformers/all-MiniLM-L6-v2"

# How old the newest snapshot in the source's bucket may be before this box
# calls it stale. This is the check that catches a source whose backup timer
# has quietly stopped — without it the mirror finds the same file it restored
# last week, recognises it, and reports "nothing to do", which is exactly what
# being up to date looks like. 48 hours allows one missed nightly run before
# anybody is woken.
#
# The sync passes --fail-if-stale, so exceeding this fails the unit, and a
# failed unit is what fires the alert below.
mirror_max_snapshot_age_hours: 48

# --- Knowing when it stops working -----------------------------------------
# A sync that fails is a journal entry nobody reads, and a mirror that has
# stopped syncing looks exactly like one that is up to date. Both the sync
# and the verify units carry OnFailure=, so anything that fails here runs
# sectortrace-mirror-alert.
#
# With neither of these set the alert still runs: it writes the failure into
# the mirror's state file, where `sectortrace-mirror sync-status` shows it in
# red, and logs it. That is better than nothing and worse than a webhook —
# set one.
mirror_alert_webhook: ""
# Anything else you would rather run. Receives the failing unit name as $1 and
# the last 40 journal lines on stdin.
mirror_alert_command: ""

# --- Metrics ----------------------------------------------------------------
# Where to drop a Prometheus textfile-collector file after each sync. Empty
# disables it. The usual node_exporter path is
# /var/lib/node_exporter/textfile_collector.
#
# The metric worth alerting on is sectortrace_mirror_snapshot_timestamp_seconds
# — how old the evidence being served actually is, as opposed to when this box
# last did some work. A mirror that syncs perfectly every night from a source
# that stopped producing snapshots a month ago has a perfect record and
# month-old data.
mirror_metrics_dir: ""

# --- Proving it still matches -----------------------------------------------
# The sync checks that what it restored is what the snapshot held (restore
# re-counts every table and rolls back on a disagreement). Nothing re-checks
# the archive afterwards, so:
#
#   weekly  `archive-mirror --dry-run --fail-if-missing` compares the bucket's
#           key set against local disk and transfers nothing. In live PostgreSQL
#           modes
#           it also runs `check-postgres-sync`, which compares both warehouses
#           value by value without changing either.
#   monthly `archive-verify` re-hashes every object in the LOCAL store. This
#           is the only thing that proves the local copy is byte-identical to
#           what the source archived, and it is the audit trail, so it is
#           worth the I/O.
#
# Both fail loudly, which means both alert.
# Ties to whether recurring sync runs at all: "does this box still match the
# source" is a meaningless question to keep asking about a beta box whose
# whole point is to be written to and diverge from the source between
# deliberate reseeds. A dr_mirror keeps its historical default (true).
mirror_verify_enabled: "{{ mirror_recurring_sync_enabled }}"
mirror_verify_time: "Mon *-*-* 05:30:00"
mirror_verify_deep_time: "*-*-01 05:30:00"

# Concurrent downloads during an archive sync. Each object is a separate small
# request, so this is latency-bound rather than bandwidth-bound and 8 is a
# large improvement over 1 without being rude to a bucket you are paying for.
mirror_archive_workers: 8

# `pipeline restore --force` snapshots the warehouse it is about to replace,
# labelled superseded-by-restore, and a labelled backup is never pruned
# automatically — deliberately, because on a real deployment the
# second-commonest reason to restore is having restored the wrong thing.
#
# On a mirror that reasoning is weaker in one specific way: what a restore
# replaces here is itself a copy of the source, and the source still has the
# original. So the sync keeps the newest few and deletes the rest, rather
# than filling the disk with nightly copies of a warehouse nobody wrote to.
# Set to 0 to keep every one of them (and watch the disk).
mirror_superseded_keep: 2

# The subnet this box's Docker network claims. Pinned rather than left to
# Docker's pool because tunnel mode compares the two warehouses' server
# identities and refuses if they match — and two hosts provisioned the same
# way both hand PostgreSQL 172.18.0.2. See docker-compose.mirror.yml.j2.
mirror_docker_subnet: "172.29.0.0/16"

# The sync refuses to start when the filesystem holding state_dir has less
# than this free. A restore writes a superseded snapshot before it replaces
# anything, and an archive sync writes whatever the source has added — both
# are worse to run out of space part way through than to not start.
mirror_min_free_gb: 10

# --- snapshot mode: the source's offsite backup bucket -------------------------
# Where the source deployment's sectortrace-backup-offsite script puts its
# verified snapshots. Its own vars.yml calls this backup_s3_prefix, and
# defaults it to warehouse-backups under the archive bucket.
#
# Read-only credentials are enough and are what to use: this box never
# writes to the source's buckets, and a key on a mirror is a key in one more
# place.
mirror_backup_s3_prefix: "warehouse-backups"

# --- live PostgreSQL mode: reaching the source's PostgreSQL --------------------
# Tunnel mode reaches a source that publishes PostgreSQL on its own loopback:
# a systemd unit holds `ssh -N -L` open and restarts it when it drops. URL mode
# does not use these tunnel settings; it reads the complete source URL from
# the encrypted vault instead.
#
# Use the source's read-only role (sectortrace_reader). migrate-postgres
# only ever reads the source, and a mirror holding a credential that could
# write to the authoritative warehouse is a bad trade for nothing.
mirror_tunnel_local_port: 5433
mirror_ssh_host: ""
mirror_ssh_user: "root"
mirror_ssh_port: 22
mirror_ssh_key: "/root/.ssh/sectortrace-mirror"
# Where the source's PostgreSQL listens *on the source box*. The tunnel's
# far end, not this one.
mirror_source_pg_host: "127.0.0.1"
mirror_source_pg_port: 5432
mirror_source_pg_database: "sectortrace"
mirror_source_pg_user: "sectortrace_reader"

# =============================================================================
#  Local analyst assistant (BETA-107)
# =============================================================================
# The optional natural-language operator finding aid, off by default and
# never on Railway (docs/assistant.md). It reads only warehouse content, so
# a mirror is a legitimate place to run it — with the mirror's usual
# caveat: anything it retrieves over (document_embeddings) is replaced on
# the next sync, so on a beta box turn mirror_nlp_rebuild on, or embed by
# hand after each deliberate reseed, or the retrieval tool has nothing.
#
# Two switches, because provisioning the model runtime and authorising the
# feature are different decisions:
#
#   assistant_runtime_enabled  stands up a single Ollama (its own compose
#                              file, on the mirror network), builds the
#                              `openai` extra into the app image, and points
#                              ASSISTANT_OLLAMA_URL / ASSISTANT_NEEDLE_URL
#                              at it.
#   assistant_app_enabled      writes ASSISTANT_ENABLED=true into the
#                              rendered .env. Do NOT set it until `pipeline
#                              nlp assistant-eval` reports gate.may_enable:
#                              true. On a beta box you can instead put
#                              ASSISTANT_ENABLED=true in .env.merge, which
#                              overrides the rendered value and survives the
#                              checkout reset — see .env.merge.example.
assistant_runtime_enabled: false
assistant_app_enabled: false

# One Ollama serves both roles the assistant calls (synthesis and the
# router). It `ollama pull`s this reference once, and the app is told to
# send exactly this string as the model name — no `ollama cp` alias, so the
# name the code sends is the name Ollama has, and the run ledger records
# what actually answered.
#
# Default: `LiquidAI/LFM2.5-350M-GGUF` at Q4_K_M, pulled from Hugging Face
# via Ollama's `hf.co/` syntax (0.4B params, 219 MB). Small on purpose:
# routing has an 8-second timeout (pipeline/assistant/routing.py) and a
# CPU-only box cannot meet it with a multi-billion-parameter model. On a
# fast many-core box or one with a GPU, `hf.co/LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M`
# (3B, 1.59 GB) is the better answer quality. The pinned constant in
# pipeline/assistant/runtime.py is the 1.2B-Instruct; serving a different
# LFM2.5 size is what assistant_lfm_model below is for. NOT
# `ollama.com/library/lfm2`, a 24B model.
assistant_lfm_ollama_ref: "hf.co/LiquidAI/LFM2.5-350M-GGUF:Q4_K_M"

# What the adapters put in the `model` field and the ledger records
# (ASSISTANT_LFM_MODEL / _QUANT / ASSISTANT_NEEDLE_MODEL). Default to the
# pulled reference so the wire call matches; override independently only to
# run a genuinely separate router model on the same Ollama.
assistant_lfm_model: "{{ assistant_lfm_ollama_ref }}"
assistant_lfm_quant: "Q4_K_M"
assistant_needle_model: "{{ assistant_lfm_ollama_ref }}"

# Pinned like every other image here (neo4j:5-community, caddy:2-alpine).
# Bump deliberately — but not below a 2026 build: LFM2.5 is a hybrid
# architecture whose `attention.head_count_kv` is a per-layer array, and
# Ollama < ~0.9 panics parsing that GGUF (`interface conversion: *ggml.array,
# not uint32`) on model load, not on pull, so it looks healthy until the
# first request. A wrong tag fails cleanly at `docker compose pull`.
assistant_ollama_image: "ollama/ollama:0.33.2"

# A ceiling, not a reservation — the same blast-radius reasoning as
# documents_mem_limit_mb. A 2.6B Q4 model plus a 32K KV cache sits inside
# this. NOT part of the preflight role's RAM budget: leave headroom yourself
# on a box that also runs a document worker.
assistant_ollama_mem_limit_mb: "{{ [[(ansible_memtotal_mb | int * 0.25) | int, 3072] | max, 6144] | min }}"
