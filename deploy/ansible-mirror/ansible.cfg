[defaults]
inventory = inventory/localhost.ini
# The OS-level roles are the self-host build's, used unchanged: a hardening
# or tuning fix belongs in one place, and a mirror is the same Debian box
# with the same exposure. Only the stack role differs, and that one is here.
roles_path = roles:../ansible/roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
