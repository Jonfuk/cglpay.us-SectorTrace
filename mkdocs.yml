# The documentation site. It is built by CI and by whoever is editing docs;
# nothing in a collection run, the test suite or either front end depends on
# it, and `uv sync` without `--extra docs` will not install it.
#
# Read the validation block below before the theme block. That is where the
# value is: `mkdocs build --strict` fails the build on a link to a file that
# no longer exists, on a document added without a nav entry, and on a nav
# entry pointing at a document that was deleted. The site being browsable is
# the smaller half of why this exists.
site_name: SectorTrace
site_description: >-
  England-wide substance misuse sector evidence pipeline: public-domain
  evidence collected with full provenance for a trade union pay campaign.
site_url: https://jonfuk.github.io/cglpay.us-SectorTrace/
repo_url: https://github.com/Jonfuk/cglpay.us-SectorTrace
repo_name: cglpay.us-SectorTrace
# Relative to docs_dir, which is why it carries `docs/`. The generated
# pages under reference/ back out of it with `../` -- see gen_ref_pages.py.
edit_uri: edit/master/docs/
copyright: Public-domain evidence. See docs/SOURCES.md for the licence of each source.

docs_dir: docs
site_dir: site

# Every one of these is a build failure under --strict. `omitted_files` is
# the one that does the work asked of it: a new document in docs/ that nobody
# added to the nav below fails CI rather than sitting unreachable.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: materialx
  language: en
  # Inter for body copy, Archivo for headings (see docs/stylesheets/extra.css).
  # Naming them here would normally mean a request to Google on every page
  # load, which the two front ends are not allowed to make and neither is
  # this. The privacy plugin downloads both at build time and rewrites the
  # references to local copies, so the published page still fetches nothing
  # from anywhere else.
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  # Archivo for headings. A URL rather than an import inside extra.css: the
  # privacy plugin downloads this and rewrites the reference to a local copy,
  # and it does that without discarding the stylesheet -- which is what it
  # does to a stylesheet that carries the import itself. That cost this file
  # a silent disappearance from the build once; hence the note.
  - https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap
  - stylesheets/extra.css

plugins:
  - search

  # Downloads every external asset the build references -- the two webfonts
  # above -- and rewrites those references to local copies. The no-CDN rule
  # enforced by the build rather than by remembering.
  - materialx/privacy

  # When a page was last changed, resolved from git while the site builds.
  # The question it answers is how current a caveat is, which is worth a line
  # on an evidence site.
  #
  # Not MaterialX's bundled document-dates, which was the obvious choice and
  # was tried: its core.js requests gravatar.com and weavatar.com on every
  # page load to decide which avatar host is faster, and it does that with
  # show_author off and no author anywhere in the output. A documentation site
  # that reports its readers' addresses to two third parties in order to print
  # a date is not a trade this project makes.
  #
  # This one renders the date into the HTML at build time. Nothing runs in the
  # reader's browser and nothing is fetched.
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: false
      locale: en
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            # The docstrings here are prose that explains a constraint, not
            # Google-style sections. Handing them to a section parser makes
            # it invent headings out of the first paragraph that happens to
            # end in a colon, so no style is declared.
            docstring_style: null
            show_source: true
            # The generated page already carries the dotted path as its
            # H1; letting the handler add its own repeats it.
            show_root_heading: false
            show_root_full_path: false
            show_if_no_docstring: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_[^_]"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  # GitHub's slug algorithm, not Python-Markdown's. These docs are written to
  # be read in the checkout as much as on the site, so their in-page anchors
  # are the ones GitHub generates -- an em-dash heading gives `--` there and a
  # single `-` here. Matching GitHub means the same link works in both places;
  # the alternative was editing anchors in the docs to suit the site and
  # breaking every one of them on github.com.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

# Only the reference documentation. The working registers -- the roadmap, the
# UI plans and backlogs, the verification records, the benchmark write-up, the
# mySociety request -- are dropped from the build entirely by the hook in
# scripts/mkdocs_hooks.py, not merely left out of this list: a page absent
# from the nav is still built and still reachable by URL.
#
# They remain in the repository. Links to them from these pages resolve to
# GitHub rather than to a page that would not exist here.
nav:
  - Home: index.md
  - Evidence and method:
      - Caveats: CAVEATS.md
      - Sources: SOURCES.md
      - Data dictionary: DATA_DICTIONARY.md
      - AI promotion policy: AI_PROMOTION_POLICY.md
      - Evidence graph: evidence-graph.md
  - Running it:
      - Deployment: DEPLOYMENT.md
      - Backups: BACKUP.md
  - Reference: reference/
