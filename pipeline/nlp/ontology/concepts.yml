# SectorTrace ontology — concepts (BETA-034B)
#
# A hand-maintained controlled vocabulary for the substance-misuse treatment
# sector, sized to what a pay-campaign evidence base needs to reason about:
# who provides and commissions services, what those services and treatments
# are, the workforce that delivers them, and the funding and commissioning
# pressures around them.
#
# WHAT THIS IS AND IS NOT
#   * A concept is a stable id plus the surface forms that mean it. Downstream
#     tables store the id, never a display string — so renaming a label or
#     adding an alias never invalidates a stored annotation.
#   * It is a reading aid for wording, not a claim about the sector. A chunk
#     tagged `finance.funding_reduction` contains language about a funding
#     cut; whether a cut happened, to whom, is a person's call through the
#     review queue.
#   * `categories` may be plural. `pressure` is a marker category: it flags a
#     concept that names a difficulty or negative situation, so the 034C
#     classifier and 034E assertion layer can treat "no recruitment
#     difficulties" differently from "recruitment difficulties remain".
#   * Aliases are matched whole-token after normalisation (lowercase,
#     punctuation to spaces, corporate suffixes dropped), never as
#     substrings. Short or ambiguous forms that would match nonsense in free
#     text (`via`, `cgl`, a bare `key`) are left out or listed in the
#     loader's _UNSAFE_VARIANTS.
#   * `related` links are navigational only — no arithmetic, no inference, no
#     transitive closure is ever computed over them.
#
# VERSIONING. `pipeline/nlp/ontology.py` hashes the canonical content of this
# file (and relations.yml) into `ontology_version`, recorded on every nlp_run
# that consumes it. Editing a concept is expected; a new version recomputes
# downstream annotations alongside the old, never in place.

schema_version: "1"

categories:
  - substance      # a drug or drug class
  - medication     # a prescribed drug used in treatment
  - treatment      # a clinical or psychosocial intervention
  - service        # a configured service or service model
  - role           # a job role in the workforce
  - workforce      # a workforce condition or attribute
  - finance        # funding, budgets, cost
  - commissioning  # procurement and contracting
  - outcome        # a treatment or population outcome measure
  - provider       # a generic provider type
  - commissioner   # a generic commissioner type
  - pressure       # marker: names a difficulty / negative situation

concepts:

