  - id: substance.heroin
    label: heroin
    categories: [substance]
    aliases: [heroin, diamorphine, street heroin]
    related: [substance.opioids]
  - id: substance.alcohol
    label: alcohol
    categories: [substance]
    aliases: [alcohol, alcohol use, alcohol misuse, alcohol dependence, problem drinking, harmful drinking]
    related: [service.alcohol_care_team, treatment.community_detox]
  - id: substance.cocaine
    label: cocaine
    categories: [substance]
    aliases: [cocaine, powder cocaine, crack, crack cocaine]
  - id: substance.cannabis
    label: cannabis
    categories: [substance]
    aliases: [cannabis, marijuana, skunk]
  - id: substance.benzodiazepines
    label: benzodiazepines
    categories: [substance]
    aliases: [benzodiazepines, benzos, diazepam, street benzodiazepines]
