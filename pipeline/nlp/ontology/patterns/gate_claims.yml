# Affirming-predication patterns for the 034G gate predicates (BETA-047, D-08).
#
# Why this file exists: `relations.CONCEPT_PREDICATE` used to map five gate
# concepts to their predicate on any alias match. The aliases for those
# concepts are labelling aliases -- "agency staff", "waiting list", "rising
# costs", "vacancy" -- so a sentence *about* the topic (a question, a
# scrutiny-proposal title, "we are reducing our agency use", a budget line)
# came through as an AFFIRMED claim. Ensemble model triage over the whole
# queue found 0-6 real positives per category against a floor of 65.
#
# 034F now fires those five only on a construction that ASSERTS the thing --
# a reliance / pressure / transfer verb with its subject in the same clause.
# 034E assertion status still handles negation, hypothetical and historical
# framings of a match; these patterns keep the non-assertive framings from
# ever matching. Conservative on purpose: a pattern set that over-fires
# reburies the queue, and the gate favours precision over recall.
#
# The concepts keep their broad aliases -- 034C labelling still wants them.

schema_version: "1"

patterns:
  # --- workforce.relies_on_agency ---------------------------------------
  - id: gate.agency.reliance_on
    kind: predicate
    predicate: workforce.relies_on_agency
    regex: '\b(rel(y|ies|ied|iance|iant)|depend(s|ed|ent|ence|ency)?)\b[^.?!]{0,25}\b(on|upon)\b[^.?!]{0,25}\b(agency|locum)\b'
    notes: "growing reliance on agency staff; the service is reliant on locums"
  - id: gate.agency.staff_were_relied_on
    kind: predicate
    predicate: workforce.relies_on_agency
    regex: '\b(agency|locum)\b[^.?!]{0,20}\b(staff|workers?|cover)\b[^.?!]{0,25}\b(are|were|have been|being|remain\w*|continu\w+)\b[^.?!]{0,20}\b(relied|depended|used|deployed|brought in|needed)\b'
    notes: "agency staff were relied upon to fill rota gaps"
  - id: gate.agency.fill_gaps_with
    kind: predicate
    predicate: workforce.relies_on_agency
    regex: '\b(fill\w*|cover\w*|met|being met|staffed)\b[^.?!]{0,25}\b(gap|gaps|vacanc\w+|shift\w*|rota\w*|post\w*|absence\w*)\b[^.?!]{0,20}\b(with|using|through|via|by)\b[^.?!]{0,15}\b(agency|locum)\b'
    notes: "filling rota gaps with agency workers; vacancies covered by agency staff"
  - id: gate.agency.gaps_covered_by
    kind: predicate
    predicate: workforce.relies_on_agency
    regex: '\b(vacanc\w+|gap\w*|shift\w*|rota\w*|post\w*|absence\w*|cover|shortfall\w*)\b[^.?!]{0,25}\b(are |were |being )?(cover\w*|fill\w*|met|staffed|bridg\w+)\b[^.?!]{0,15}\b(by|with|using|through)\b[^.?!]{0,12}\b(agency|locum)\b'
    notes: "vacancies are being covered by agency workers"
  - id: gate.agency.significant_use_or_spend
    kind: predicate
    predicate: workforce.relies_on_agency
    regex: '\b(significant|considerable|substantial|heav\w+|extensive|high(er)?|increas\w+|rising|growing|ongoing|continued|persistent|£\s?\d[\d,.]*[mk]?|\d[\d.]*\s?%)\b[^.?!]{0,20}\b(use|reliance|spend\w*|expenditure|usage|numbers?|proportion)\b[^.?!]{0,15}\b(on |of )?[^.?!]{0,8}\b(agency|locum)\b'
    notes: "significant use of agency staff; agency spend of £1.2m; a growing proportion of agency workers"
  - id: gate.agency.spend_or_numbers_rose
    kind: predicate
    predicate: workforce.relies_on_agency
    regex: '\b(agency|locum)\b[^.?!]{0,10}\b(staff|worker\w*|spend\w*|cost\w*|usage|expenditure|numbers?)\b[^.?!]{0,25}\b(has |have |had )?(increas\w+|risen|rose|grew|grown|doubl\w+|higher|up (by|to)|remain\w+ high)\b'
    notes: "agency spend has increased; agency staff numbers rose"

  # --- workforce.has_vacancy_pressure ---------------------------------
  - id: gate.vacancy.high_level
    kind: predicate
    predicate: workforce.has_vacancy_pressure
    regex: '(\b(high|significant|rising|increasing|increased|large|persistent|considerable|substantial)\b|\d[\d.]*\s?%)[^.?!]{0,25}\b(vacanc\w+|vacancy rate|unfilled posts?|staffing gaps?)\b'
    notes: "a high vacancy rate; significant vacancies; a 22% vacancy rate"
  - id: gate.vacancy.posts_unfilled
    kind: predicate
    predicate: workforce.has_vacancy_pressure
    regex: '\b(vacanc\w+|posts?|roles?|positions?)\b[^.?!]{0,30}\b(remain\w*|are|were|being|stay\w*|left|sat|sit\w*)\b[^.?!]{0,15}\b(unfilled|vacant|hard to fill|difficult to fill|open|empty)\b'
    notes: "posts remain unfilled; vacancies were hard to fill"
  - id: gate.vacancy.rate_percent
    kind: predicate
    predicate: workforce.has_vacancy_pressure
    regex: '\bvacanc\w+\b[^.?!]{0,20}\b(rate|level|of|at|running at|currently|stands? at|around)\b[^.?!]{0,10}\d[\d.,]*\s?(%|per cent)'
    notes: "a vacancy rate of 15%; vacancies running at 20 per cent"
  - id: gate.vacancy.count_of_posts
    kind: predicate
    predicate: workforce.has_vacancy_pressure
    regex: '\b\d[\d.,]*\s+(current |unfilled |long[- ]term |wte |fte |established )*(vacanc\w+|vacant posts?|posts? (are |were )?(vacant|unfilled))\b'
    notes: "34 vacancies; 12 WTE posts vacant"
  - id: gate.vacancy.struggle_to_fill
    kind: predicate
    predicate: workforce.has_vacancy_pressure
    regex: '\b(struggl\w+|difficult\w*|challeng\w+|unable|hard)\b[^.?!]{0,25}\b(fill|recruit(ing)? (to|into)|staff)\b[^.?!]{0,15}\b(posts?|vacanc\w+|roles?|positions?)\b'
    notes: "struggling to fill vacant posts"

  # --- workforce.undergoes_tupe -------------------------------------
  - id: gate.tupe.staff_transfer_under
    kind: predicate
    predicate: workforce.undergoes_tupe
    regex: '\b(staff|employees|workforce|the team|these posts?)\b[^.?!]{0,35}\b(will|are|were|being|to be|shall)\b[^.?!]{0,20}\b(transferr?\w*|tuped?)\b[^.?!]{0,25}\b(under|via|through|by)\b[^.?!]{0,20}\b(tupe|transfer of undertakings)\b'
    notes: "staff will transfer under TUPE"
  - id: gate.tupe.applies_to_staff
    kind: predicate
    predicate: workforce.undergoes_tupe
    regex: '\btupe\b[^.?!]{0,30}\b(appl\w+|cover\w+|protect\w+|in scope|engaged|relevant)\b[^.?!]{0,25}\b(staff|employees|the (team|workforce)|these|to)\b'
    notes: "TUPE will apply to the affected staff; TUPE covers the transferring team"
  - id: gate.tupe.staff_subject_to
    kind: predicate
    predicate: workforce.undergoes_tupe
    regex: '\b(staff|employees|the (team|workforce)|posts?|\d[\d.,]* (staff|employees|posts?))\b[^.?!]{0,25}\b(are|were|will be|to be|being)\b[^.?!]{0,15}\b(subject to|covered by|in scope for|affected by|eligible for|transferr\w* under)\b[^.?!]{0,15}\btupe\b'
    notes: "the 14 staff are subject to TUPE"
  - id: gate.tupe.tuped_across
    kind: predicate
    predicate: workforce.undergoes_tupe
    regex: '\b(staff|employees|the team)\b[^.?!]{0,20}\b(tuped? (across|over)|transferr?\w* (across|over|to the (new|incoming) (provider|contractor)))\b'
    notes: "staff tuped across to the new provider"

  # --- finance.has_cost_pressure -----------------------------------
  - id: gate.cost.facing_pressure
    kind: predicate
    predicate: finance.has_cost_pressure
    regex: '\b(facing|faces|faced|experienc\w+|under|subject to|absorb\w+|there (is|are|has been|have been))\b[^.?!]{0,30}\b(cost|financial|inflationary|budget(ary)?|pay[- ]award|demand|price)\b[^.?!]{0,12}\bpressure'
    notes: "the service is facing significant cost pressures; there are cost pressures"
  - id: gate.cost.rising_pressure
    kind: predicate
    predicate: finance.has_cost_pressure
    regex: '\b(rising|increasing|mounting|significant|considerable|ongoing|unavoidable|unfunded|substantial|acute)\b[^.?!]{0,15}\b(cost|financial|inflationary|budget(ary)?|price|demand)\b[^.?!]{0,10}\bpressure'
    notes: "rising cost pressures; significant financial pressure"
  - id: gate.cost.inflation_hit
    kind: predicate
    predicate: finance.has_cost_pressure
    regex: '\b(inflation\w*|energy costs?|pay award|national insurance|the living wage)\b[^.?!]{0,25}\b(has|have|is|are|will)\b[^.?!]{0,20}\b(add\w+|increas\w+|driv\w+|push\w+|cost\w*|impact\w*|hit)\b'
    notes: "inflation has added £400k to the contract cost"
  - id: gate.cost.pressure_of_amount
    kind: predicate
    predicate: finance.has_cost_pressure
    regex: '\b(cost|financial|inflationary|budget(ary)?)\b[^.?!]{0,10}\bpressure\w*\b[^.?!]{0,25}\b(of|amounting to|estimated at|totall\w+|worth)\b[^.?!]{0,15}(£\s?\d|\d[\d.]*\s?%)'
    notes: "a cost pressure of £1.2m"
  - id: gate.cost.unfunded_pay_award
    kind: predicate
    predicate: finance.has_cost_pressure
    regex: '\b(unfunded|un-funded|un funded)\b[^.?!]{0,15}\bpay award\b'
    notes: "an unfunded pay award"

  # --- service.reports_waiting_time ------------------------------
  - id: gate.wait.time_is_n_weeks
    kind: predicate
    predicate: service.reports_waiting_time
    regex: '\b(wait\w*|waiting (time|list))\b[^.?!]{0,25}\b(of|is|was|are|were|stands at|reached|averag\w+|now)\b[^.?!]{0,15}\b\d[\d.,]*\s?(week|day|month|working day)s?\b'
    notes: "the waiting time is now 6 weeks"
  - id: gate.wait.n_week_wait
    kind: predicate
    predicate: service.reports_waiting_time
    regex: '\b\d[\d.,]*[- ]?(week|day|month)s?\b[^.?!]{0,10}\b(wait|waiting (time|list|period))\b'
    notes: "a 6-week wait for treatment"
  - id: gate.wait.people_waiting_n
    kind: predicate
    predicate: service.reports_waiting_time
    regex: '\b(clients?|patients?|people|service users?|individuals?|referrals?)\b[^.?!]{0,20}\b(wait\w*|are waiting|were waiting|on the waiting list)\b[^.?!]{0,25}\b\d[\d.,]*\s?(week|day|month)s?\b'
    notes: "clients were waiting up to 12 weeks"
  - id: gate.wait.list_of_n
    kind: predicate
    predicate: service.reports_waiting_time
    regex: '\bwaiting list of\b[^.?!]{0,10}\b\d[\d,]{1,}\b'
    notes: "a waiting list of 340"
