<!doctype html>
<html lang="en-GB">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis control plane</title>

</head>

      <section class="panel"><h2>Emerging themes</h2><div id="analysis-themes"></div></section>
    </div>
    <section class="panel"><h2>Recent automated signals</h2><div id="analysis-signals"></div></section>
  </main>
